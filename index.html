<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Incident Chronology Studio</title>
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--blue:#38bdf8;--green:#34d399;--amber:#fbbf24;--rose:#f43f5e;--purple:#c084fc;--teal:#2dd4bf;--text:#f8fafc;--muted:#94a3b8;--bd:#475569;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;line-height:1.5;padding:1rem}
header{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:center;padding-bottom:1rem;border-bottom:1px solid var(--bd);margin-bottom:1.5rem}
h1{font-size:1.2rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.badge{background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.3);font-size:.75rem;padding:.15rem .5rem;border-radius:9999px;font-weight:500}
.hc{display:flex;gap:.5rem;flex-wrap:wrap}
.btn-header,.btn-secondary,.btn-xs{background:var(--bg3);border:1px solid var(--bd);color:var(--text);border-radius:.375rem;cursor:pointer}
.btn-header{background:transparent;color:var(--muted);padding:.4rem .8rem;font-size:.85rem}
.btn-secondary{padding:.35rem .75rem;font-size:.8rem}
.btn-xs{font-size:.75rem;padding:.2rem .5rem;background:var(--bg2)}
.btn-xs.promote{color:var(--teal);border-color:var(--teal)}
.btn-header:hover,.btn-secondary:hover,.btn-xs:hover{border-color:var(--blue);color:var(--text)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.app{display:grid;grid-template-columns:1fr;gap:1.5rem}
@media(min-width:1024px){.app{grid-template-columns:460px 1fr}}
.panel{background:var(--bg2);border:1px solid var(--bd);border-radius:.5rem;padding:1.25rem;display:flex;flex-direction:column;gap:1rem}
.panel-title{font-size:1rem;font-weight:600;color:var(--blue);border-bottom:1px solid var(--bd);padding-bottom:.5rem}
.fg{display:flex;flex-direction:column;gap:.35rem}
.row{display:flex;gap:.5rem}.row>input{flex:1}
label{font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=datetime-local],select,textarea{background:var(--bg);border:1px solid var(--bd);color:var(--text);padding:.5rem .75rem;border-radius:.375rem;font-size:.9rem;font-family:inherit;width:100%}
textarea{resize:vertical;min-height:70px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.cat-btn{padding:.5rem;background:var(--bg);border:1px solid var(--bd);color:var(--muted);border-radius:.375rem;font-size:.8rem;font-weight:600;cursor:pointer}
.cat-btn.active[data-cat=OBSERVED_EVENT]{background:rgba(56,189,248,.2);color:var(--blue);border-color:var(--blue)}
.cat-btn.active[data-cat=DECISION]{background:rgba(192,132,252,.2);color:var(--purple);border-color:var(--purple)}
.cat-btn.active[data-cat=ACTION]{background:rgba(52,211,153,.2);color:var(--green);border-color:var(--green)}
.cat-btn.active[data-cat=COMMUNICATION]{background:rgba(251,191,36,.2);color:var(--amber);border-color:var(--amber)}
.cat-btn[data-cat=CONTEXT_NOTE]{grid-column:1/-1}
.cat-btn.active[data-cat=CONTEXT_NOTE]{background:rgba(45,212,191,.15);color:var(--teal);border-color:var(--teal)}
.dyn{display:none;flex-direction:column;gap:.85rem;background:rgba(0,0,0,.15);padding:.75rem;border-radius:.375rem;border:1px dashed var(--bd)}
.dyn.active{display:flex}
.btn-submit{background:var(--blue);color:#0f172a;font-weight:700;border:none;padding:.65rem;border-radius:.375rem;cursor:pointer;font-size:.9rem;flex:1}
.btn-submit:hover{opacity:.9}
.tc{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.75rem}
.ab,.chips{display:flex;gap:.35rem;flex-wrap:wrap}
.ab{align-items:center}
.ab select{width:auto;padding:.3rem .5rem;font-size:.8rem}
.chip{font-size:.75rem;padding:.2rem .5rem;border-radius:.25rem;border:1px solid var(--bd);background:var(--bg);color:var(--muted);cursor:pointer}
.chip.active{background:var(--bg3);color:var(--text);border-color:var(--blue)}
.tl{display:flex;flex-direction:column;gap:.75rem;max-height:550px;overflow-y:auto;padding-right:.25rem}
.card{background:var(--bg);border:1px solid var(--bd);border-left:4px solid var(--bd);border-radius:.375rem;padding:.85rem;display:flex;flex-direction:column;gap:.5rem}
.card.cat-OBSERVED_EVENT{border-left-color:var(--blue)}.card.cat-DECISION{border-left-color:var(--purple)}.card.cat-ACTION{border-left-color:var(--green)}.card.cat-COMMUNICATION{border-left-color:var(--amber)}.card.cat-CONTEXT_NOTE{border-left-color:var(--teal);border-left-style:dashed}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;flex-wrap:wrap}
.tag{font-size:.7rem;font-weight:700;padding:.1rem .4rem;border-radius:.25rem;margin-right:.35rem}
.tag-event{background:rgba(56,189,248,.15);color:var(--blue)}.tag-decision{background:rgba(192,132,252,.15);color:var(--purple)}.tag-action{background:rgba(52,211,153,.15);color:var(--green)}.tag-comm{background:rgba(251,191,36,.15);color:var(--amber)}.tag-note{background:rgba(45,212,191,.15);color:var(--teal)}.tag-phase{background:var(--bg3);color:var(--muted)}
.tag-ms{background:transparent;color:var(--amber);border:1px solid var(--amber)}
.gnote{font-size:.75rem;color:var(--muted)}
.gprog{font-size:.8rem;color:var(--amber);font-weight:600}
.gboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.75rem;max-height:520px;overflow-y:auto;padding-right:.25rem}
.gcol{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.gcol h3{font-size:.85rem;color:var(--blue)}
.gi{background:var(--bg);border:1px solid var(--bd);border-radius:.375rem;padding:.6rem;display:flex;flex-direction:column;gap:.35rem}
.gi.st-done{border-color:var(--green)}.gi.st-unknown{border-color:var(--teal);border-style:dashed}.gi.st-na{opacity:.7}
.gh{display:flex;justify-content:space-between;gap:.5rem;align-items:center;flex-wrap:wrap}
.gcsf{font-family:var(--mono);font-size:.65rem;color:var(--muted)}
.gq{font-size:.85rem;font-weight:600;overflow-wrap:anywhere}
.gt{font-size:.75rem;color:var(--muted);overflow-wrap:anywhere}
.gempty{font-size:.85rem;color:var(--muted)}
.slotbox{font-size:.8rem;border:1px dashed var(--teal);border-radius:.375rem;padding:.5rem;display:flex;flex-direction:column;gap:.35rem;background:rgba(45,212,191,.08);overflow-wrap:anywhere}
.slotbox .btn-xs{align-self:flex-start}
.ct{font-family:var(--mono);font-size:.8rem;color:var(--amber);font-weight:600}.ct small{color:var(--muted);font-weight:400}
.cb{font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}
.cm{font-size:.75rem;color:var(--muted);background:rgba(255,255,255,.03);padding:.4rem;border-radius:.25rem;display:flex;flex-direction:column;gap:.25rem;overflow-wrap:anywhere}
.ca{display:flex;justify-content:flex-end;gap:.4rem}
.md{font-family:var(--mono);font-size:.8rem;background:var(--bg);color:#e2e8f0;border:1px solid var(--bd);border-radius:.375rem;padding:.85rem;height:350px;overflow:auto;white-space:pre-wrap}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;justify-content:center;align-items:center;padding:1rem}
.modal.active{display:flex}
.mc{background:var(--bg2);border:1px solid var(--bd);border-radius:.5rem;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1rem}
.mh{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);padding-bottom:.5rem;gap:.5rem}
.gs h3{font-size:.95rem;color:var(--blue)}.gs p{font-size:.85rem;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;gap:.75rem;text-align:center;color:var(--muted);font-size:.9rem;padding:1.5rem 1rem;border:1px dashed var(--bd);border-radius:.375rem}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--blue);padding:.5rem 1rem;border-radius:.375rem;font-size:.85rem;z-index:200;max-width:90vw}
</style>
</head>
<body>
<header>
  <h1><span>🛡️ Incident Chronology Studio</span><span class="badge" data-i18n="header.privacy"></span></h1>
  <div class="hc">
    <button class="btn-header" id="langToggle">🌐 English / 日本語</button>
    <button class="btn-header" id="openGuide" data-i18n="header.guideBtn"></button>
  </div>
</header>

<main class="app">
<section class="panel">
  <h2 class="panel-title" data-i18n="form.title"></h2>
  <div class="slotbox" id="slotBox" hidden></div>

  <div class="fg">
    <label data-i18n="form.categoryLabel"></label>
    <div class="cgrid">
      <button type="button" class="cat-btn active" data-cat="OBSERVED_EVENT" data-i18n="cat.observedEvent"></button>
      <button type="button" class="cat-btn" data-cat="DECISION" data-i18n="cat.decision"></button>
      <button type="button" class="cat-btn" data-cat="ACTION" data-i18n="cat.action"></button>
      <button type="button" class="cat-btn" data-cat="COMMUNICATION" data-i18n="cat.comm"></button>
      <button type="button" class="cat-btn" data-cat="CONTEXT_NOTE" data-i18n="cat.note"></button>
    </div>
  </div>

  <div class="fg">
    <label for="eventTime" data-i18n="form.timeLabel"></label>
    <div class="row"><input type="datetime-local" id="eventTime" step="60"><button type="button" class="btn-secondary" id="nowBtn" data-i18n="form.nowBtn"></button></div>
    <select id="timeMode" aria-label="Time mode">
      <option value="exact" data-i18n="form.modeExact"></option>
      <option value="range" data-i18n="form.modeRange"></option>
      <option value="text" data-i18n="form.modeText"></option>
    </select>
  </div>
  <div class="fg" id="rowEnd" hidden><label for="timeEnd" data-i18n="form.endLabel"></label><input type="datetime-local" id="timeEnd" step="60"></div>
  <div class="fg" id="rowText" hidden><label for="timeText" data-i18n="form.textLabel"></label><input type="text" id="timeText" maxlength="200" data-i18n-ph="form.textPh"></div>

  <div class="fg">
    <label for="phase" data-i18n="form.phaseLabel"></label>
    <select id="phase"></select>
  </div>

  <div class="fg">
    <label for="milestone" data-i18n="form.milestoneLabel"></label>
    <select id="milestone"></select>
  </div>

  <div class="dyn active" id="secObservedEvent">
    <div class="fg"><label for="eventEvidence" data-i18n="form.evidenceLabel"></label><input type="text" id="eventEvidence" data-i18n-ph="form.evidencePh"></div>
  </div>
  <div class="dyn" id="secDecision">
    <div class="fg"><label for="decActor" data-i18n="form.decisionMakerLabel"></label><input type="text" id="decActor" data-i18n-ph="form.decisionMakerPh"></div>
    <div class="fg"><label for="decRationale" data-i18n="form.rationaleLabel"></label><input type="text" id="decRationale" data-i18n-ph="form.rationalePh"></div>
  </div>
  <div class="dyn" id="secAction">
    <div class="fg"><label for="actAssignee" data-i18n="form.assigneeLabel"></label><input type="text" id="actAssignee" data-i18n-ph="form.assigneePh"></div>
    <div class="fg"><label for="actArtifact" data-i18n="form.artifactLabel"></label><input type="text" id="actArtifact" data-i18n-ph="form.artifactPh"></div>
  </div>
  <div class="dyn" id="secComm">
    <div class="fg"><label for="commRecipient" data-i18n="form.recipientLabel"></label><input type="text" id="commRecipient" data-i18n-ph="form.recipientPh"></div>
    <div class="fg"><label for="commChannel" data-i18n="form.channelLabel"></label><input type="text" id="commChannel" data-i18n-ph="form.channelPh"></div>
  </div>
  <div class="dyn" id="secNote">
    <div class="fg"><label for="noteBasis" data-i18n="form.basisLabel"></label><input type="text" id="noteBasis" data-i18n-ph="form.basisPh"></div>
    <div class="fg"><label for="noteVerify" data-i18n="form.verifyLabel"></label><input type="text" id="noteVerify" data-i18n-ph="form.verifyPh"></div>
  </div>

  <div class="fg">
    <label for="summary" data-i18n="form.summaryLabel"></label>
    <textarea id="summary" data-i18n-ph="form.summaryPh"></textarea>
  </div>

  <div class="row">
    <button type="button" class="btn-submit" id="addBtn"></button>
    <button type="button" class="btn-secondary" id="cancelEdit" hidden data-i18n="form.cancelBtn"></button>
  </div>
</section>

<section style="display:flex;flex-direction:column;gap:1.5rem;min-width:0">
  <div class="panel">
    <h2 class="panel-title" data-i18n="meta.title"></h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem">
      <div class="fg"><label for="incTitle" data-i18n="meta.nameLabel"></label><input type="text" id="incTitle" value="202611-Malware-Infection-Handling"></div>
      <div class="fg"><label for="incCommander" data-i18n="meta.commanderLabel"></label><input type="text" id="incCommander" data-i18n-ph="meta.commanderPh"></div>
      <div class="fg"><label for="incTz" data-i18n="meta.tzLabel"></label><input type="text" id="incTz" maxlength="40"></div>
    </div>
  </div>

  <div class="panel">
    <div class="tc">
      <h2 class="panel-title" style="border:none;padding:0" data-i18n="tpl.title"></h2>
      <div class="ab">
        <label for="tplSelect" data-i18n="tpl.pick"></label>
        <select id="tplSelect"></select>
        <button class="btn-secondary" id="hintBtn" aria-pressed="true" data-i18n="tpl.hints"></button>
      </div>
    </div>
    <div class="gnote" data-i18n="tpl.disclaimer"></div>
    <div class="gprog" id="tplProgress"></div>
    <div class="gboard" id="guideBoard"></div>
  </div>

  <div class="panel">
    <div class="tc">
      <h2 class="panel-title" style="border:none;padding:0"><span data-i18n="timeline.title"></span> (<span id="itemCount">0</span>)</h2>
      <div class="ab">
        <button class="btn-secondary" id="sortBtn" data-i18n="timeline.sortBtn"></button>
        <button class="btn-secondary" id="exportJsonBtn" data-i18n="timeline.exportBtn"></button>
        <button class="btn-secondary" id="importJsonBtn" data-i18n="timeline.importBtn"></button>
        <button class="btn-secondary" id="sampleBtn" data-i18n="timeline.sampleBtn"></button>
        <button class="btn-secondary" id="clearBtn" data-i18n="timeline.clearBtn"></button>
        <input type="file" id="jsonFileInput" accept=".json,application/json" hidden>
      </div>
    </div>
    <div class="chips" style="align-items:center;padding-top:.5rem;border-top:1px dashed var(--bd)">
      <span style="font-size:.75rem;color:var(--muted);font-weight:600" data-i18n="timeline.filterLabel"></span>
      <button class="chip" data-filter="ALL" data-i18n="filter.all"></button>
      <button class="chip" data-filter="OBSERVED_EVENT" data-i18n="filter.observed"></button>
      <button class="chip" data-filter="DECISION" data-i18n="filter.dec"></button>
      <button class="chip" data-filter="ACTION" data-i18n="filter.act"></button>
      <button class="chip" data-filter="COMMUNICATION" data-i18n="filter.comm"></button>
      <button class="chip" data-filter="CONTEXT_NOTE" data-i18n="filter.note"></button>
    </div>
    <div class="tl" id="timelineList"></div>
  </div>

  <div class="panel">
    <div class="tc">
      <h2 class="panel-title" style="border:none;padding:0" data-i18n="report.title"></h2>
      <div class="ab">
        <label for="reportLang" data-i18n="report.langLabel"></label>
        <select id="reportLang"><option value="en">English</option><option value="ja">日本語</option></select>
        <button class="btn-secondary" id="copyMdBtn" data-i18n="report.copyBtn"></button>
        <button class="btn-secondary" id="dlMdBtn" data-i18n="report.dlBtn"></button>
        <button class="btn-secondary" id="dlCsvBtn" data-i18n="report.csvBtn"></button>
      </div>
    </div>
    <div class="md" id="markdownOutput" tabindex="0"></div>
  </div>
</section>
</main>

<div class="modal" id="guideModal" role="dialog" aria-modal="true" aria-labelledby="guideTitle">
  <div class="mc">
    <div class="mh"><h2 id="guideTitle" data-i18n="guide.title"></h2><button class="btn-xs" id="closeGuide" aria-label="Close">✕</button></div>
    <div class="gs"><h3 data-i18n="guide.sec1Title"></h3><p data-i18n="guide.sec1Body"></p></div>
    <div class="gs"><h3 data-i18n="guide.sec2Title"></h3><p data-i18n="guide.sec2Body"></p></div>
    <div class="gs"><h3 data-i18n="guide.sec3Title"></h3><p data-i18n="guide.sec3Body"></p></div>
  </div>
</div>
<div id="toast" role="status" hidden></div>

<script>
const i18n={
en:{

/* ---------- markdown ---------- */
let lastMd='';
const mc=s=>(s===undefined||s===null||s===''?'-':String(s)).replace(/\|/g,'\\|').replace(/\r?\n/g,'<br>');
const tbl=(h,rows)=>rows.length?'| '+h.join(' | ')+' |\n|'+h.map(()=>' :--- |').join('')+'\n'+rows.map(r=>'| '+r.map(mc).join(' | ')+' |\n').join('')+'\n':'*'+tr('r.none')+'*\n\n';
function fmtDur(ms){
  const m=Math.round(ms/60000),d=Math.floor(m/1440),h=Math.floor(m%1440/60),n=m%60,ja=rlang==='ja',p=[];
  if(d)p.push(d+(ja?'日':'d'));if(h)p.push(h+(ja?'時間':'h'));if(n||!p.length)p.push(n+(ja?'分':'m'));
  return p.join(ja?'':' ');
}
function msSection(L){
  const got=MS.map(k=>{
    const c=L.filter(i=>i.milestone===k&&TRE.test(mst(i))).sort((a,b)=>mst(a).localeCompare(mst(b)));
    return c.length?{k,t:mst(c[0]),i:c[0],est:c[0].timeMode==='text'}:null;
  }).filter(Boolean);
  const by={};got.forEach(g=>by[g.k]=g);
  let o=tbl([tr('r.th.milestone'),tr('r.th.time'),tr('r.th.summary')],got.map(g=>[tr('ms.'+g.k),fd(g.t)+(g.est?' '+tr('r.est'):''),g.i.summary]));
  const rows=PAIRS.filter(p=>by[p[0]]&&by[p[1]]).map(p=>{
    const a=by[p[0]],b=by[p[1]],d=tms(b.t)-tms(a.t),n=[];
    if(d<0)n.push(tr('r.orderWarn'));if(a.est||b.est)n.push(tr('r.est'));
    return [tr('ms.'+p[0])+' → '+tr('ms.'+p[1]),d<0?'-':fmtDur(d),n.join('; ')];
  });
  if(rows.length)o+=tbl([tr('r.th.interval'),tr('r.th.duration'),tr('r.th.note')],rows)+'*'+tr('r.durNote')+'*\n\n';
  return o;
}
function openSection(){
  if(!state.tpl)return '';
  const rows=tplIds(state.tpl).map(id=>({id,st:slotStatus(id)})).filter(x=>x.st!=='done').map(x=>[tr('tpl.col.'+TI[x.id][0]),itx(x.id,rlang)[0],tr('tpl.st.'+x.st),x.st==='na'?state.slotNa[x.id]:'',TI[x.id][4]]);
  return '## 8. '+tr('r.sec.open')+'\n\n**'+tr('r.th.template')+':** '+tr('tpl.'+state.tpl)+'\n\n'
    +(rows.length?tbl([tr('r.th.col'),tr('r.th.item'),tr('r.th.status'),tr('r.th.note'),tr('r.th.csf')],rows):'*'+tr('r.noOpen')+'*\n\n')
    +'*'+tr('r.openNote')+'*\n\n';
}
function generateMarkdown(){
  const ti=$('incTitle').value.replace(/\s+/g,' ').trim()||tr('r.defaultTitle');
  const cmd=$('incCommander').value.replace(/\s+/g,' ').trim()||tr('r.na');
  const tz=$('incTz').value.replace(/\s+/g,' ').trim()||tr('r.na');
  const L=state.items.slice().sort(cmp);
  const det=i=>FIELDS[i.category].filter(f=>i[f]).map(f=>tr('c.'+f)+': '+i[f]).join('; ');
  let md='# '+ti+'\n\n**'+tr('r.generated')+':** '+new Date().toISOString().slice(0,16).replace('T',' ')+' UTC\n**'+tr('r.commander')+':** '+cmd+'\n**'+tr('r.tz')+':** '+tz+'\n\n---\n\n';
  md+='## 1. '+tr('r.sec.ms')+'\n\n'+msSection(L);
  md+='## 2. '+tr('r.sec.timeline')+'\n\n'+tbl([tr('r.th.time'),tr('r.th.type'),tr('r.th.phase'),tr('r.th.milestone'),tr('r.th.summary'),tr('r.th.details')],L.map(i=>[fmtT(i),tr(CATKEY[i.category]),tr('ph.'+i.phase),MS.includes(i.milestone)?tr('ms.'+i.milestone):'',i.summary,det(i)]));
  const sec=(n,key,cat)=>{
    const f=FIELDS[cat];
    return '## '+n+'. '+tr(key)+'\n\n'+tbl([tr('r.th.time'),tr('r.th.phase'),tr('r.th.summary'),...f.map(x=>tr('c.'+x))],L.filter(i=>i.category===cat).map(i=>[fmtT(i),tr('ph.'+i.phase),i.summary,...f.map(x=>i[x])]));
  };
  md+=sec(3,'r.sec.events','OBSERVED_EVENT')+sec(4,'r.sec.notes','CONTEXT_NOTE')+sec(5,'r.sec.decisions','DECISION')+sec(6,'r.sec.actions','ACTION')+sec(7,'r.sec.comms','COMMUNICATION')+openSection();
  md+='---\n*'+tr('r.footer')+'*\n';
  lastMd=md;$('markdownOutput').textContent=md;
}

/* ---------- guide templates: [question, hint] per item ---------- */
const TPLT={
en:{
'c.first':["When and how was the incident first noticed?","Who or what raised it (alert, user report) and the time. Record it as the Detected entry."],
'c.since':["Since when might the activity have been going on?","An estimate is fine. Earlier traces go under Phase 0. This sets the Occurred milestone."],
'c.scope':["Which systems, users, accounts and data are affected?","List what is confirmed so far. Keep suspected targets for separate notes."],
'c.lead':["Who leads the response, and who is the contact point?","Name the incident lead and a contact for updates, so every decision has an owner."],
'c.real':["What shows this is a real incident, not a false alarm?","Record the basis for the decision to declare an incident."],
'c.impact':["What are the business and data impacts, and how urgent is it?","Consider how critical the asset is, what has stopped, whether data is involved and how recoverable it is."],
'c.contain':["How will you contain it: isolate now, or watch a little longer?","Record the choice and the reason. Quick isolation and observing the attacker can pull in different directions."],
'c.contdone':["Was containment carried out, and with what result?","Who did what and when, and whether the spread stopped. Record it as the Contained milestone."],
'c.evid':["Has evidence been preserved?","Memory, disk images, logs. Note what was taken, by whom, and where the hashes are kept."],
'c.erad':["Was the cause removed everywhere it exists?","Cleaned or rebuilt hosts, disabled accounts, fixed the exploited weakness. Record it as Eradicated."],
'c.verify':["Was integrity checked before systems returned to service?","Check backups and restored systems for signs of compromise, then confirm normal operation. Record it as Recovered."],
'c.notify':["Who must be told, and are there notification duties?","Leadership, affected parties, regulators, contracts. Check the latest laws and agreements, because deadlines differ."],
'c.close':["Are the closing criteria met, and who writes the after-action report?","Record the decision to close, the lessons learned and who follows up."],
'm.vector':["How might the malware have got in?","A suspected route such as an email attachment, web download or removable media. Keep it as a note until confirmed."],
'm.other':["Do other devices show the same signs?","Search logs and EDR for the same indicators on other hosts."],
'm.c2':["Were the related indicators blocked and shared?","Hashes, domains and IPs. Note where they were blocked and who received them."],
'm.cred':["Do credentials used on the device need resetting?","Consider passwords, tokens and keys that were available on the infected device."],
'r.note':["What do the ransom note and the encryption look like?","Note file names, changed extensions, affected folders and the start time."],
'r.spread':["Is encryption still spreading, and what about shares and backups?","Check whether network shares and backup systems are being reached."],

/* ---------- guide board ---------- */
function slotStatus(id){
  const L=state.items.filter(i=>i.slot===id);
  if(L.some(i=>i.category!=='CONTEXT_NOTE'))return 'done';
  if(L.length)return 'unknown';
  return Object.prototype.hasOwnProperty.call(state.slotNa,id)?'na':'todo';
}
function renderGuide(){
  const box=$('guideBoard');
  $('tplSelect').value=state.tpl;
  $('hintBtn').setAttribute('aria-pressed',state.hints);
  if(!state.tpl){box.innerHTML='<p class="gempty">'+esc(t('tpl.empty'))+'</p>';$('tplProgress').textContent='';return}
  const ids=tplIds(state.tpl),n={todo:0,done:0,unknown:0,na:0};
  box.innerHTML=COLS.map(c=>'<div class="gcol"><h3>'+esc(t('tpl.col.'+c))+'</h3>'+ids.filter(id=>TI[id][0]===c).map(id=>{
    const st=slotStatus(id),x=itx(id,lang);n[st]++;
    const b=(a,k)=>'<button class="btn-xs" data-gact="'+a+'" data-id="'+esc(id)+'">'+esc(t(k))+'</button>';
    return '<div class="gi st-'+st+'"><div class="gh"><span class="tag tag-phase">'+esc(t('tpl.st.'+st))+'</span><span class="gcsf">'+esc(TI[id][4])+'</span></div>'
      +'<div class="gq">'+esc(x[0])+'</div>'+(state.hints?'<div class="gt">'+esc(x[1])+'</div>':'')
      +(st==='na'&&state.slotNa[id]?'<div class="gt">'+esc(state.slotNa[id])+'</div>':'')
      +'<div class="ca">'+b('fill','tpl.btn.fill')+(st==='todo'||st==='na'?b('unknown','tpl.btn.unknown'):'')+(st==='todo'?b('na','tpl.btn.na'):'')+(st==='na'?b('unna','tpl.btn.undoNa'):'')+'</div></div>';
  }).join('')+'</div>').join('');
  $('tplProgress').textContent=t('tpl.progress').replace('{a}',n.done).replace('{n}',ids.length).replace('{u}',n.unknown).replace('{x}',n.na);
}
function fillSlot(id,unk){
  const d=TI[id],q=itx(id,lang)[0];
  endEdit();clearForm();
  setCat(unk?'CONTEXT_NOTE':d[1]);setMode('exact');
  $('phase').value=d[2];$('milestone').value=unk?'':d[3];
  if(unk){$('summary').value=t('tpl.unknownPrefix')+q;$('noteVerify').value=q}
  state.pendingSlot=id;showSlot();$('summary').focus();window.scrollTo({top:0,behavior:'smooth'});
}
$('guideBoard').addEventListener('click',e=>{
  const b=e.target.closest('button[data-gact]');if(!b)return;
  const id=b.dataset.id,a=b.dataset.gact;if(!hasTI(id))return;
  if(a==='fill')fillSlot(id,false);
  else if(a==='unknown')fillSlot(id,true);
  else if(a==='na'){const r=prompt(t('tpl.naPrompt'),'');if(r===null)return;state.slotNa[id]=r.slice(0,300);touch()}
  else if(a==='unna'){delete state.slotNa[id];touch()}
});
$('slotBox').addEventListener('click',e=>{if(e.target.closest('#slotClear')){state.pendingSlot='';showSlot()}});
$('tplSelect').addEventListener('change',e=>{state.tpl=TPLS.includes(e.target.value)?e.target.value:'';state.dirty=true;render()});
$('hintBtn').addEventListener('click',()=>{state.hints=!state.hints;render()});

/* ---------- init ---------- */
$('eventTime').value=nowLocal();
$('incTz').value=tzDefault();
setCat('OBSERVED_EVENT');setMode('exact');
updateLang('en');
</script>
